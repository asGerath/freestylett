services:
  web:
    build:
      context: .
      target: development
    container_name: freestylett_web
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
      WATCHPACK_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - freestylett_node_modules:/app/node_modules
      - freestylett_next_cache:/app/.next
    stdin_open: true
    tty: true

volumes:
  freestylett_node_modules:
  freestylett_next_cache:
